[project]
name = "tariff-rag"
version = "0.1.0"
description = "Cited Q&A over Co-op Bank Kenya's published tariff guide, with guardrails, fallback and automated evaluation."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.115",
    "numpy>=2.0",
    "pydantic>=2.8",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "python-dotenv>=1.0",
    "rank-bm25>=0.2.2",
    "uvicorn>=0.30",
    "fastembed>=0.9.1",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tariff_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
